# Front server (docker-compose service `app-edge`). It sends the Django admin
# panel and API docs to Django, and everything else to the Next.js app.
#
# It also passes the visitor's real address on: Django's login rate limit and
# audit log need it. X-Forwarded-For is overwritten (not appended) because
# this is the first hop, so visitors can't spoof it.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Django: admin panel, API docs and their static files. The rest of the
    # Django API is reached only through the app (/api/django/...).
    location ~ ^/(admin|api/docs|api/schema|static/(admin|rest_framework|drf_spectacular_sidecar))/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
