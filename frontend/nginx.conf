server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Backend: API, admin panel and its static files
    location ~ ^/(api|admin|static/(admin|rest_framework|drf_spectacular_sidecar))/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React build assets have hashed names, so they can be cached for long
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/warehouse, /sales, ...) all load index.html
    location / {
        try_files $uri /index.html;
    }
}
