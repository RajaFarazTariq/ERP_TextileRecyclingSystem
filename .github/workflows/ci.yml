name: CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_ci
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-secret
      DEBUG: 'False'
      DB_ENGINE: postgresql
      DB_NAME: erp_ci
      DB_USER: erp
      DB_PASSWORD: erp_ci_password
      DB_HOST: localhost
      DB_PORT: '5432'
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: System checks
        run: python manage.py check
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test apps

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # CI=false: the existing react-hooks/exhaustive-deps warnings are reported
      # but don't fail the build (fixing them could change when pages refetch).
      - name: Build
        run: npm run build
        env:
          CI: 'false'
