# Full stack: PostgreSQL + Django API (gunicorn) + React app (nginx).
#
#   docker compose up -d --build     → http://localhost:8080
#
# Secrets (SECRET_KEY, email settings) come from backend/.env. The database
# password comes from POSTGRES_PASSWORD in a root .env file (see
# .env.docker.example); the default below is only for local use.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Overrides for running inside Docker
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: erp
      DB_USER: erp
      DB_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_password}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
