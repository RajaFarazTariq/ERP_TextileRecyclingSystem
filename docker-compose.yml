# Full stack: PostgreSQL + Django API (gunicorn) + Next.js app, behind nginx.
#
#   docker compose up -d --build     → http://localhost:8080
#                                      (admin panel at /admin/, API docs at /api/docs/)
#
# Secrets (SECRET_KEY, email settings) come from backend/.env. The database
# password comes from POSTGRES_PASSWORD in a root .env file (see
# .env.docker.example); the default below is only for local use.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Overrides for running inside Docker
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: erp
      DB_USER: erp
      DB_PASSWORD: ${POSTGRES_PASSWORD:-erp_local_password}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      NUM_PROXIES: '1'   # nginx or the Next.js app sits in front
      INTERNAL_HOSTS: backend   # the Next.js app calls http://backend:8000
    depends_on:
      db:
        condition: service_healthy

  # The web app. It talks to Django server-side and keeps the login in
  # httpOnly cookies.
  app:
    build: ./frontend
    restart: unless-stopped
    environment:
      DJANGO_API_URL: http://backend:8000/api/v1/
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      - backend

  # Front server: sends /admin/ and /api/docs/ to Django and the rest to the
  # app, and passes the visitor's real address on (see frontend/nginx.edge.conf)
  app-edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.edge.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
      - backend

volumes:
  pgdata:
