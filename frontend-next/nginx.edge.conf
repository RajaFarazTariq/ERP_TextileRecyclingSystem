# Edge proxy in front of the Next.js app (docker-compose service `app-edge`).
# Its job is to pass the visitor's real address on: the app forwards it to
# Django, whose login rate limit and audit log need it. X-Forwarded-For is
# overwritten (not appended) because this is the first hop, so visitors can't
# spoof it.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
